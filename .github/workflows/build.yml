name: Build APK & AAB

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
  ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
  ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Extract version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Set up latest Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Cache target files
        uses: Swatinem/rust-cache@v2

      - name: Set up dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm lld libgl1-mesa-dev libx11-dev libxkbcommon-dev libwayland-dev

      - name: Install xbuild
        run: cargo install --path patches/xbuild/xbuild

      - name: Determine keys to build
        id: check_keys
        run: |
          if [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "HAS_SECRETS=true" >> $GITHUB_ENV
          else
            echo "HAS_SECRETS=false" >> $GITHUB_ENV
          fi

      - name: Write release key
        if: env.HAS_SECRETS == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_FILE }}" | base64 --decode > target/x/release/android/gradle/app/release-key.jks

      - name: Build aarch64 & x64 APK
        run: |
          export RUSTFLAGS="-Clink-arg=-Wl,-z,max-page-size=16384"
          x build --release --platform android --arch arm64,x64 --format apk

      - name: Rename built APK
        run: |
          mv target/x/release/android/localdesktop.apk localdesktop-universal.apk

      - name: Build aarch64 & x64 AAB
        run: |
          export RUSTFLAGS="-Clink-arg=-Wl,-z,max-page-size=16384"
          x build --release --platform android --arch arm64,x64 --format aab

      - name: Rename built AAB
        run: |
          mv target/x/release/android/localdesktop.aab localdesktop-universal.aab

      - name: Rename APKs and upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: localdesktop-universal.apk
          path: localdesktop-universal.apk

      - name: Rename AABs and upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: localdesktop-universal.aab
          path: localdesktop-universal.aab

      - name: Release Note Check
        id: get_release_notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "Looking for notes for version $VERSION in CHANGELOG.md"

          # Extract notes between the matching version header and the next version header
          awk "/^## $VERSION/ {flag=1; next} /^## / {if (flag) {flag=0; exit}} flag" CHANGELOG.md > release_notes.txt

          if [ -s release_notes.txt ]; then
            echo "Release notes found."
            echo "HAS_RELEASE_NOTES=true" >> $GITHUB_ENV
          else
            echo "No release notes found."
            echo "HAS_RELEASE_NOTES=false" >> $GITHUB_ENV
          fi

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            localdesktop-universal.apk
            localdesktop-universal.aab
          body_path: ${{ env.HAS_RELEASE_NOTES == 'true' && 'release_notes.txt' || '' }}
          fail_on_unmatched_files: true
          draft: true
